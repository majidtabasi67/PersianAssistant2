
name: Extract PersianAssistant ZIP

on:
  workflow_dispatch:

permissions:
  
permissions:
  contents: write
  workflows: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          mkdir -p /tmp/persian
          unzip -q PersianAssistant.zip -d /tmp/persian
          PROJECT_DIR=$(find /tmp/persian -mindepth 1 -maxdepth 1 -type d | head -n 1)
          cp -R "$PROJECT_DIR"/. .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract PersianAssistant project" || echo "No changes"
          git push
